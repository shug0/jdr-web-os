<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirme ton compte - JDR Coffee</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
        <p>Bonjour {{ .Email }},</p>
        <br>
        
        <p>Bienvenue sur JDR Coffee ! Pour confirmer ton compte, clique sur le bouton ci-dessous :</p>
        <br>
        
        <a href="{{ .ConfirmationURL }}" 
           style="
             display: inline-block;
             padding: 0.75rem 1.5rem;
             background-color: #8B4513;
             color: #fff;
             border-radius: 0.375rem;
             font-weight: 600;
             text-decoration: none;
             font-size: 1rem;
             text-align: center;
             box-shadow: 0 1px 2px rgba(16,30,54,0.04);
             border: none;
           ">
          Confirmer mon compte
        </a>
        
        <br><br>
        <p>Si tu n'as pas créé ce compte, ignore simplement cet e-mail.</p>
        <p>Ce lien expirera dans 24 heures.</p>
        <br>
        
        <p>L'équipe JDR Coffee ☕</p>
    </div>
</body>
</html>
